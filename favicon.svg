<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="100%" stop-color="#020306"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08d9d6"/>
      <stop offset="100%" stop-color="#ff2e63"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#neon)" stroke-width="2.5"/>
  <!-- Corner Cyber Accents -->
  <circle cx="12" cy="12" r="1.5" fill="#08d9d6" opacity="0.8"/>
  <circle cx="52" cy="12" r="1.5" fill="#ff2e63" opacity="0.8"/>
  <circle cx="12" cy="52" r="1.5" fill="#ff2e63" opacity="0.8"/>
  <circle cx="52" cy="52" r="1.5" fill="#08d9d6" opacity="0.8"/>
  <!-- Monogram AAR -->
  <g filter="url(#glow)">
    <path d="M22 44 L32 20 L42 44 M25.5 36 L38.5 36" fill="none" stroke="#08d9d6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="32" cy="28" r="1.8" fill="#ff2e63"/>
  </g>
</svg>